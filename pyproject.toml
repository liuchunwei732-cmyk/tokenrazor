[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenrazor"
version = "0.2.0"
description = "AI 编程的上下文智能编排层 — 不只省 Token，更让 AI 看懂你的项目"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

authors = [
    {name = "Kevin Liu", email = "kevin@kevinkathy.com"},
]

dependencies = [
    "click>=8.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/liuchunwei732-cmyk/tokenrazor"
Repository = "https://github.com/liuchunwei732-cmyk/tokenrazor"
Documentation = "https://github.com/liuchunwei732-cmyk/tokenrazor#readme"

[project.scripts]
tokenrazor = "tokenrazor.cli:main"

[tool.setuptools]
packages = [
    "tokenrazor",
    "tokenrazor.core",
    "tokenrazor.utils",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
