[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenrazor"
version = "0.5.0"
description = "AI 编程的上下文智能编排层 — 剪枝 CoT、过滤终端输出、项目感知，帮你省 30-60% Token"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

authors = [
    {name = "Kevin Liu", email = "liuchunwei732@gmail.com"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/liuchunwei732-cmyk/tokenrazor"
Repository = "https://github.com/liuchunwei732-cmyk/tokenrazor"
Documentation = "https://github.com/liuchunwei732-cmyk/tokenrazor#readme"

[project.scripts]
tokenrazor = "tokenrazor.cli:main"

[tool.setuptools]
packages = [
    "tokenrazor",
    "tokenrazor.core",
    "tokenrazor.utils",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tokenrazor"]
omit = ["tokenrazor/__main__.py"]
